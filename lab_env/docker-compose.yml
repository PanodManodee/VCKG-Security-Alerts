# VCKG lab environment (topology of lab_network.pdf). Run from lab_env/, see README.md.
#
#   Attacker (Kali) -> Firewall (+ Suricata IDS) -> DMZ : Nginx, Web
#                               -> APP    : API, Jenkins
#                               -> DATA   : PostgreSQL, Files-SMB
#                               -> Office : Admin-PC, Dep-PC
#                     Wazuh (manager, indexer, dashboard) in its own "sec" network.
#
# Every host routes other zones through the firewall (entrypoint.sh sets the default route), so
# only the flows in firewall/rules.sh (= lab/zone_edges.csv) get through.
# Every agent reads /var/log/auth.log and /var/log/syslog (rsyslog); LAB_LOGFILES adds service logs.
# IPs and software versions here must match lab/assets.csv and lab/services.csv.
name: vckg-lab

x-host: &host
  cap_add: [NET_ADMIN]          # entrypoint.sh replaces the default route
  depends_on: [firewall]
  env_file: .env
  environment: &host-env
    WAZUH_MANAGER: 10.10.90.10

x-build-args: &build-args
  WAZUH_VERSION: ${WAZUH_VERSION:-4.9.2}

networks:
  internet: { ipam: { config: [{ subnet: 172.30.0.0/24 }] } }
  dmz:      { ipam: { config: [{ subnet: 10.10.10.0/24 }] } }
  app:      { ipam: { config: [{ subnet: 10.10.20.0/24 }] } }
  data:     { ipam: { config: [{ subnet: 10.10.30.0/24 }] } }
  office:   { ipam: { config: [{ subnet: 10.10.40.0/24 }] } }
  sec:      { ipam: { config: [{ subnet: 10.10.90.0/24 }] } }

services:
  # ---------------------------------------------------------------- edge
  firewall:
    build: { context: ., dockerfile: firewall/Dockerfile }
    hostname: firewall
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
    environment:
      FW_ALLOW_EGRESS: ${FW_ALLOW_EGRESS:-0}
      IDS_NFQUEUE: ${IDS_NFQUEUE:-1}
    networks:
      internet: { ipv4_address: 172.30.0.254 }
      dmz:      { ipv4_address: 10.10.10.254 }
      app:      { ipv4_address: 10.10.20.254 }
      data:     { ipv4_address: 10.10.30.254 }
      office:   { ipv4_address: 10.10.40.254 }
      sec:      { ipv4_address: 10.10.90.254 }

  ids:
    # Suricata network IDS (paper §III.A.2) in the firewall's network namespace: it sees all traffic between zones.
    # Alerts (EVE JSON) go to Wazuh through the agent `ids`; alert_kg maps them to the asset by destination IP.
    build: { context: ., dockerfile: ids/Dockerfile, args: *build-args }
    image: vckg-lab-ids
    network_mode: "service:firewall"
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    depends_on: [firewall]
    environment:
      WAZUH_MANAGER: 10.10.90.10
      WAZUH_AGENT_NAME: ids
      LAB_LOGFILES: json:/var/log/suricata/eve.json
      IDS_MODE: ${IDS_MODE:-nfq}

  kali:
    build: { context: ., dockerfile: kali/Dockerfile }
    hostname: kali
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on: [firewall]
    networks:
      internet: { ipv4_address: 172.30.0.10 }

  # ---------------------------------------------------------------- DMZ
  nginx:
    <<: *host
    build: { context: ., dockerfile: hosts/nginx/Dockerfile, args: *build-args }
    hostname: nginx
    environment:
      <<: *host-env
      LAB_GATEWAY: 10.10.10.254
      LAB_LOGFILES: apache:/var/log/nginx/lab_access.log syslog:/var/log/nginx/lab_error.log
    networks:
      dmz: { ipv4_address: 10.10.10.11 }

  web:
    <<: *host
    build: { context: ., dockerfile: hosts/web/Dockerfile, args: *build-args }
    hostname: web
    environment:
      <<: *host-env
      LAB_GATEWAY: 10.10.10.254
      LAB_LOGFILES: apache:/usr/local/apache2/logs/access_log apache:/usr/local/apache2/logs/error_log
    networks:
      dmz: { ipv4_address: 10.10.10.12 }

  # ---------------------------------------------------------------- APP
  api:
    <<: *host
    build: { context: ., dockerfile: hosts/api/Dockerfile, args: *build-args }
    hostname: api
    environment:
      <<: *host-env
      LAB_GATEWAY: 10.10.20.254
      LAB_LOGFILES: apache:/var/log/api/access.log
    networks:
      app: { ipv4_address: 10.10.20.21 }

  jenkins:
    <<: *host
    build: { context: ., dockerfile: hosts/jenkins/Dockerfile, args: *build-args }
    hostname: jenkins
    environment: { <<: *host-env, LAB_GATEWAY: 10.10.20.254 }
    volumes: [jenkins_home:/var/jenkins_home]
    networks:
      app: { ipv4_address: 10.10.20.22 }

  # ---------------------------------------------------------------- DATA
  postgresql:
    <<: *host
    build: { context: ., dockerfile: hosts/postgresql/Dockerfile, args: *build-args }
    hostname: postgresql
    environment:
      <<: *host-env
      LAB_GATEWAY: 10.10.30.254
      LAB_LOGFILES: postgresql_log:/var/log/postgresql/postgresql.log
    volumes: [pg_data:/var/lib/postgresql/data]
    networks:
      data: { ipv4_address: 10.10.30.31 }

  files-smb:
    <<: *host
    build: { context: ., dockerfile: hosts/files-smb/Dockerfile, args: *build-args }
    hostname: files-smb
    environment: { <<: *host-env, LAB_GATEWAY: 10.10.30.254 }
    networks:
      data: { ipv4_address: 10.10.30.32 }

  # ---------------------------------------------------------------- Office
  admin-pc:
    <<: *host
    build: { context: ., dockerfile: hosts/workstation/Dockerfile, args: *build-args }
    image: vckg-lab-workstation
    hostname: admin-pc
    environment:
      <<: *host-env
      LAB_GATEWAY: 10.10.40.254
      PC_USER: ${ADMIN_PC_USER:-alice}
      PC_PASSWORD: ${ADMIN_PC_PASSWORD:-Passw0rd!}
      PC_ADMIN: "1"
    networks:
      office: { ipv4_address: 10.10.40.41 }

  dep-pc:
    <<: *host
    image: vckg-lab-workstation          # same image as admin-pc (built once)
    depends_on: [firewall, admin-pc]
    hostname: dep-pc
    environment:
      <<: *host-env
      LAB_GATEWAY: 10.10.40.254
      PC_USER: ${DEP_PC_USER:-bob}
      PC_PASSWORD: ${DEP_PC_PASSWORD:-Passw0rd!}
    networks:
      office: { ipv4_address: 10.10.40.42 }

  # ---------------------------------------------------------------- Wazuh (official single-node, v4.9.2)
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.9.2}
    hostname: wazuh.manager
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    ports:
      - "55000:55000"   # Wazuh API (syscollector inventory for asset_kg)
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./wazuh/config/wazuh_cluster/local_decoder.xml:/wazuh-config-mount/etc/decoders/local_decoder.xml
      - ./wazuh/config/wazuh_cluster/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml
    networks:
      sec: { ipv4_address: 10.10.90.10 }

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.9.2}
    hostname: wazuh.indexer
    ports:
      - "9200:9200"     # wazuh-alerts-* (alert ingestion, stage 3)
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    networks:
      sec: { ipv4_address: 10.10.90.11 }

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.9.2}
    hostname: wazuh.dashboard
    ports:
      - "8443:5601"     # https://localhost:8443  (admin / SecretPassword)
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on: [wazuh.indexer, wazuh.manager]
    networks:
      sec: { ipv4_address: 10.10.90.12 }

volumes:
  jenkins_home:
  pg_data:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
