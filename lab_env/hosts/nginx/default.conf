# Reverse proxy in front of the Web host (lab/asset_edges.csv: Nginx -> Web).
# Logs also go to files for the Wazuh agent (LAB_LOGFILES in docker-compose.yml). The image's
# nginx.conf keeps logging to stdout/stderr for `docker logs`.
access_log /var/log/nginx/lab_access.log combined;
error_log  /var/log/nginx/lab_error.log warn;

upstream web {
    server 10.10.10.12:80;
}

server {
    listen 80;
    server_name _;
    location / { proxy_pass http://web; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/lab.crt;
    ssl_certificate_key /etc/nginx/lab.key;
    location / { proxy_pass http://web; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
}
