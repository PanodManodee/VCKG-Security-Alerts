[global]
   workgroup = LAB
   server string = Files-SMB (lab dummy)
   server role = standalone server
   map to guest = Bad User
   log file = /var/log/samba/log.%m
   # also to syslog (rsyslog -> /var/log/syslog), which the Wazuh agent reads
   logging = syslog@3 file
   # auth_audit:3 logs one "Auth: ..." line per login with user, status and client IP
   # (decoded by lab_env/wazuh/config/wazuh_cluster/local_decoder.xml)
   log level = 1 auth_audit:3
   disable netbios = yes
   smb ports = 445

# Anyone can read and write: a deliberately weak share.
[public]
   path = /srv/public
   guest ok = yes
   read only = no

# Only the SMB_USER account (see .env).
[finance]
   path = /srv/finance
   guest ok = no
   read only = no
   valid users = @smbusers
